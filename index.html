<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#002628" />
  <meta name="description" content="بطاقات اليوم الوطني السعودي - أنشئ بطاقتك في ثوانٍ" />
  <title>بطاقات اليوم الوطني السعودي</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div class="pattern pattern-top"></div>
      <div class="hero-inner">
        <img class="ministry-logo" src="assets/ministry-logo.png" alt="وزارة التعليم" />
        <div class="brand-band">
          <img class="national-logo" src="assets/national-day-logo-new.png" alt="اليوم الوطني السعودي" />
          <h1>بطاقات اليوم الوطني السعودي</h1>
          <div class="title-rule"><span></span><b>✦</b><span></span></div>
          <p>أنشئ بطاقتك في ثوانٍ</p>
        </div>
      </div>
      <div class="hero-bottom-pattern"></div>
    </header>

    <main class="main-content">
      <section class="steps" aria-label="إنشاء البطاقة">
        <article class="step-card">
          <div class="step-number">١</div>
          <div class="step-body">
            <div class="step-title"><span class="step-icon">♙</span><h2>ادخل الاسم</h2></div>
            <input id="nameInput" type="text" autocomplete="name" placeholder="اكتب اسمك هنا ..." />
          </div>
        </article>

        <article class="step-card">
          <div class="step-number">٢</div>
          <div class="step-body">
            <div class="step-title"><span class="step-icon">✎</span><h2>سطر كلماتك للوطن</h2></div>
            <textarea id="messageInput" rows="3" placeholder="اكتب رسالتك هنا ..."></textarea>
            <div class="char-count">عدد الأحرف: <span id="charCount">٠</span></div>
          </div>
        </article>

        <article class="step-card design-step">
          <div class="step-number">٣</div>
          <div class="step-body">
            <div class="step-title"><span class="step-icon">▧</span><h2>اختر تصميم</h2></div>
            <div id="designGrid" class="design-grid" aria-label="التصاميم"></div>
          </div>
        </article>

        <button id="createBtn" class="create-btn" type="button">
          <span>✦</span> إنشاء البطاقة
        </button>
      </section>

      <section id="previewSection" class="preview-section" hidden>
        <div class="preview-heading">
          <span class="preview-eye">◉</span>
          <div>
            <h2>معاينة البطاقة</h2>
            <p>ستظهر بطاقتك هنا بعد الإنشاء</p>
          </div>
        </div>

        <div class="card-preview-wrap">
          <canvas id="previewCanvas" aria-label="معاينة البطاقة"></canvas>
        </div>

        <div class="actions">
          <button id="shareBtn" class="action-btn share" type="button"><span>↗</span> مشاركة</button>
          <button id="downloadBtn" class="action-btn download" type="button"><span>↓</span> تحميل</button>
          <button id="newCardBtn" class="action-btn new" type="button"><span>↪</span> بطاقة جديدة</button>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="counter">عدد مرات إنشاء البطاقات: <strong id="creationCount">٠</strong></div>
      <div class="footer-pattern"></div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
